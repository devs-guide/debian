---
- name: "[debian]: configure apt sources"
  hosts: all
  become: true

  vars:
    ansible_python_interpreter: "{{ ansible_python_interpreter_system }}"
    debian_release_effective: "{{ debian_release | default(ansible_facts.distribution_release | default('trixie')) }}"
    debian_components_effective: "{{ debian_components | default('main contrib non-free non-free-firmware') }}"
    debian_sources_path: "/etc/apt/sources.list.d/debian.sources"

  tasks:
    - name: Ensure apt keyring directory exists
      ansible.builtin.file:
        path: "/etc/apt/keyrings"
        state: directory
        mode: "0755"

    - name: Configure Debian archive sources for buster
      ansible.builtin.copy:
        dest: /etc/apt/sources.list
        mode: "0644"
        content: |
          deb http://archive.debian.org/debian {{ debian_release_effective }} main contrib non-free
          deb-src http://archive.debian.org/debian {{ debian_release_effective }} main contrib non-free
          deb http://archive.debian.org/debian-security {{ debian_release_effective }}/updates main contrib non-free
          deb-src http://archive.debian.org/debian-security {{ debian_release_effective }}/updates main contrib non-free
      when: debian_release_effective == 'buster'

    - name: Allow archived metadata for buster
      ansible.builtin.copy:
        dest: "/etc/apt/apt.conf.d/99-archive-{{ debian_release_effective }}"
        mode: "0644"
        content: |
          Acquire::Check-Valid-Until "false";
          Acquire::AllowInsecureRepositories "true";
      when: debian_release_effective == 'buster'

    - name: Remove deb822 sources file when using buster archive mode
      ansible.builtin.file:
        path: "{{ debian_sources_path }}"
        state: absent
      when: debian_release_effective == 'buster'

    - name: Remove archived apt override for non-buster releases
      ansible.builtin.file:
        path: "/etc/apt/apt.conf.d/99-archive-buster"
        state: absent
      when: debian_release_effective != 'buster'

    - name: Configure Debian sources (deb822)
      ansible.builtin.copy:
        dest: "{{ debian_sources_path }}"
        mode: "0644"
        content: |
          Types: deb
          URIs: http://deb.debian.org/debian
          Suites: {{ debian_release_effective }} {{ debian_release_effective }}-updates {{ debian_release_effective }}-backports
          Components: {{ debian_components_effective }}
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg

          Types: deb
          URIs: http://security.debian.org/debian-security
          Suites: {{ debian_release_effective }}-security
          Components: {{ debian_components_effective }}
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
      when: debian_release_effective != 'buster'

    - name: Refresh apt cache for new sources
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0
