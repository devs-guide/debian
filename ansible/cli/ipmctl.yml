---
- name: "[debian]: pinned ipmctl source installer"
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars:
    ansible_python_interpreter: "{{ ansible_python_interpreter_managed }}"
    ipmctl_mode: install
    ipmctl_build_user: ""
    ipmctl_build_group: ""
    ipmctl_build_home: ""
    ipmctl_repository: https://github.com/intel/ipmctl.git
    ipmctl_tag: v03.00.00.0538
    ipmctl_commit: a71f2fb1c90dd07f9862b71c789881132193e8f9
    ipmctl_expected_version: 03.00.00.0538
    ipmctl_edk2_repository: https://github.com/tianocore/edk2.git
    ipmctl_edk2_tag: edk2-stable202511
    ipmctl_edk2_commit: 46548b1adac82211d8d11da12dd914f41e7aa775
    ipmctl_install_prefix: /usr/local
    ipmctl_binary_path: /usr/local/bin/ipmctl
    ipmctl_receipt_root: /var/lib/devs-guide/ipmctl
    ipmctl_receipt_path: /var/lib/devs-guide/ipmctl/receipt.json
    ipmctl_install_manifest_path: /var/lib/devs-guide/ipmctl/install_manifest.txt
    ipmctl_patch_root: "{{ playbook_dir }}/../files/ipmctl/patches"
    ipmctl_patches:
      - id: edk2-stable202511-host-os-build
        filename: 0001-edk2-stable202511-host-os-build.patch
        sha256: ac6f0ea143c357c582135472defe8e936a63d7997221a29d4d0e4c349d7ac013
        repository: edk2
        target: MdePkg/Include/Base.h
        preimage_sha256: fedaf9edaebc77a3e94649dc344fad8047cfe04b3ec09b2e3be4dcb008517c28
        postimage_sha256: 57fb0c2cf0c147c7f787faca9a0ad4f8fb1aa3c6b1702f1faecda35852a19804
      - id: ipmctl-disable-c-release-werror
        filename: 0002-ipmctl-disable-c-release-werror.patch
        sha256: d1928dc874219578abbc9eab5cc7a826ccf88457bd148f268aff367d134321b8
        repository: ipmctl
        target: CMakeLists.txt
        preimage_sha256: fb89ac2c0f78a2a0cbf898def22363fd87495d0e851d74688e7acf18db88ef8c
        postimage_sha256: 17d0c9a012cae4ee2a2415e446a4cd44bff4e897cd7492438cd19d8c96e83f66
      - id: ipmctl-remove-pie-from-shared-linker-flags
        filename: 0003-ipmctl-remove-pie-from-shared-linker-flags.patch
        sha256: f926a6b07ad33b09f09032e6fd06a9229855d9d0501cfc7e67ecbb4c3c28a031
        repository: ipmctl
        target: CMakeLists.txt
        preimage_sha256: 17d0c9a012cae4ee2a2415e446a4cd44bff4e897cd7492438cd19d8c96e83f66
        postimage_sha256: f8e59840ef844f5631ccb1502a5cde79845f0779e267e13dd02bbb29efd80165
    ipmctl_patch_receipt:
      - filename: 0001-edk2-stable202511-host-os-build.patch
        sha256: ac6f0ea143c357c582135472defe8e936a63d7997221a29d4d0e4c349d7ac013
      - filename: 0002-ipmctl-disable-c-release-werror.patch
        sha256: d1928dc874219578abbc9eab5cc7a826ccf88457bd148f268aff367d134321b8
      - filename: 0003-ipmctl-remove-pie-from-shared-linker-flags.patch
        sha256: f926a6b07ad33b09f09032e6fd06a9229855d9d0501cfc7e67ecbb4c3c28a031

  pre_tasks:
    - name: Read Debian release and architecture
      ansible.builtin.command:
        argv: "{{ item }}"
      loop:
        - [/usr/bin/dpkg, --print-architecture]
        - [/usr/bin/sh, -c, ". /etc/os-release && printf '%s:%s\\n' \"${ID:-}\" \"${VERSION_ID:-}\""]
      register: ipmctl_platform_queries
      changed_when: false

    - name: Validate fixed installer policy
      ansible.builtin.assert:
        that:
          - ipmctl_mode == 'install'
          - ipmctl_platform_queries.results[0].stdout | trim == 'amd64'
          - ipmctl_platform_queries.results[1].stdout | trim == 'debian:13'
          - ipmctl_build_user is match('^[a-z_][a-z0-9_-]*[$]?$')
          - ipmctl_build_user != 'root'
          - ipmctl_build_group is match('^[a-z_][a-z0-9_-]*[$]?$')
          - ipmctl_build_home is match('^/[^\n\r]+$')
          - ipmctl_install_prefix == '/usr/local'
          - ipmctl_patches | length == 3
        fail_msg: >-
          The reviewed installer supports only Debian 13 amd64, one pinned
          Release tuple, /usr/local, and a non-root build user.

    - name: Resolve per-run source paths
      ansible.builtin.set_fact:
        ipmctl_run_id: "{{ lookup('pipe', '/usr/bin/date -u +%Y%m%dT%H%M%S%N') }}"
        ipmctl_cache_root: "{{ ipmctl_build_home }}/.cache/devs-guide/ipmctl"

    - name: Resolve mutable worktree paths
      ansible.builtin.set_fact:
        ipmctl_run_root: "{{ ipmctl_cache_root }}/runs/{{ ipmctl_run_id }}"
        ipmctl_source_dir: "{{ ipmctl_cache_root }}/runs/{{ ipmctl_run_id }}/ipmctl"
        ipmctl_edk2_source_dir: "{{ ipmctl_cache_root }}/runs/{{ ipmctl_run_id }}/edk2"
        ipmctl_build_dir: "{{ ipmctl_cache_root }}/runs/{{ ipmctl_run_id }}/build"

  tasks:
    - name: Inspect managed receipt and installed binary
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        checksum_algorithm: sha256
      loop:
        - "{{ ipmctl_receipt_path }}"
        - "{{ ipmctl_binary_path }}"
      register: ipmctl_initial_stats

    - name: Refuse an unmanaged local ipmctl binary
      ansible.builtin.assert:
        that:
          - >-
            not (ipmctl_initial_stats.results[1].stat.exists | default(false))
            or (ipmctl_initial_stats.results[0].stat.isreg | default(false))
        fail_msg: >-
          {{ ipmctl_binary_path }} exists without the devs-guide receipt.
          Refusing to overwrite an unmanaged installation.

    - name: Decode the optional managed receipt safely
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - |-
            import json
            import sys
            p = sys.argv[1]
            try:
                with open(p, encoding="utf-8") as receipt:
                    print(json.dumps(json.load(receipt)))
            except Exception:
                print("{}")
          - "{{ ipmctl_receipt_path }}"
      register: ipmctl_receipt_query
      changed_when: false
      when: ipmctl_initial_stats.results[0].stat.isreg | default(false)

    - name: Normalize the previous receipt
      ansible.builtin.set_fact:
        ipmctl_previous_receipt: "{{ ipmctl_receipt_query.stdout | default('{}') | from_json }}"

    - name: Read current binary version and linkage
      ansible.builtin.command:
        argv: "{{ item }}"
      loop:
        - ["{{ ipmctl_binary_path }}", version]
        - [/usr/bin/ldd, "{{ ipmctl_binary_path }}"]
      register: ipmctl_current_software
      changed_when: false
      failed_when: false
      when: ipmctl_initial_stats.results[1].stat.isreg | default(false)

    - name: Determine whether installation is current
      ansible.builtin.set_fact:
        ipmctl_install_is_current: >-
          {{
            (ipmctl_initial_stats.results[0].stat.isreg | default(false))
            and (ipmctl_initial_stats.results[1].stat.isreg | default(false))
            and (ipmctl_previous_receipt.schema_version | default(0) | int == 1)
            and (ipmctl_previous_receipt.platform.debian | default('') == '13')
            and (ipmctl_previous_receipt.platform.architecture | default('') == 'amd64')
            and (ipmctl_previous_receipt.ipmctl.tag | default('') == ipmctl_tag)
            and (ipmctl_previous_receipt.ipmctl.commit | default('') == ipmctl_commit)
            and (ipmctl_previous_receipt.ipmctl.version | default('') == ipmctl_expected_version)
            and (ipmctl_previous_receipt.edk2.tag | default('') == ipmctl_edk2_tag)
            and (ipmctl_previous_receipt.edk2.commit | default('') == ipmctl_edk2_commit)
            and (ipmctl_previous_receipt.patches | default([]) == ipmctl_patch_receipt)
            and (ipmctl_previous_receipt.install.prefix | default('') == ipmctl_install_prefix)
            and (ipmctl_previous_receipt.install.binary | default('') == ipmctl_binary_path)
            and
            (
              ipmctl_initial_stats.results[1].stat.checksum | default('')
              == ipmctl_previous_receipt.install.binary_sha256 | default('')
            )
            and (ipmctl_current_software.results[0].rc | default(1) | int == 0)
            and
            (
              (
                ipmctl_current_software.results[0].stdout
                | default('')
                | regex_search('[0-9]{2}\\.[0-9]{2}\\.[0-9]{2}\\.[0-9]{4}')
                | default('')
              )
              == ipmctl_expected_version
            )
            and (ipmctl_current_software.results[1].rc | default(1) | int == 0)
            and ('not found' not in (ipmctl_current_software.results[1].stdout | default('')))
          }}

    - name: Report current installation
      ansible.builtin.debug:
        msg: >-
          Matching receipt, binary checksum, version, and linkage found;
          source fetch, compilation, and installation are skipped.
      when: ipmctl_install_is_current | bool

    - name: Build and install pinned ipmctl
      when: not ipmctl_install_is_current | bool
      block:
        - name: Create fresh non-root build workspace
          ansible.builtin.file:
            path: "{{ ipmctl_run_root }}"
            state: directory
            mode: "0750"

        - name: Initialize exact source repositories
          ansible.builtin.command:
            argv: [/usr/bin/git, init, "{{ item.path }}"]
          loop:
            - { path: "{{ ipmctl_source_dir }}" }
            - { path: "{{ ipmctl_edk2_source_dir }}" }
          environment:
            HOME: "{{ ipmctl_build_home }}"

        - name: Add credential-free HTTPS origins
          ansible.builtin.command:
            argv: [/usr/bin/git, -C, "{{ item.path }}", remote, add, origin, "{{ item.repository }}"]
          loop:
            - { path: "{{ ipmctl_source_dir }}", repository: "{{ ipmctl_repository }}" }
            - { path: "{{ ipmctl_edk2_source_dir }}", repository: "{{ ipmctl_edk2_repository }}" }
          environment:
            HOME: "{{ ipmctl_build_home }}"

        - name: Fetch only reviewed source tags
          ansible.builtin.command:
            argv:
              - /usr/bin/git
              - -C
              - "{{ item.path }}"
              - fetch
              - --depth=1
              - origin
              - "refs/tags/{{ item.tag }}:refs/tags/{{ item.tag }}"
          loop:
            - { path: "{{ ipmctl_source_dir }}", tag: "{{ ipmctl_tag }}" }
            - { path: "{{ ipmctl_edk2_source_dir }}", tag: "{{ ipmctl_edk2_tag }}" }
          environment:
            HOME: "{{ ipmctl_build_home }}"

        - name: Check out reviewed commits detached
          ansible.builtin.command:
            argv: [/usr/bin/git, -C, "{{ item.path }}", checkout, --detach, "{{ item.commit }}"]
          loop:
            - { path: "{{ ipmctl_source_dir }}", commit: "{{ ipmctl_commit }}" }
            - { path: "{{ ipmctl_edk2_source_dir }}", commit: "{{ ipmctl_edk2_commit }}" }
          environment:
            HOME: "{{ ipmctl_build_home }}"

        - name: Read checked-out and tag source identities
          ansible.builtin.command:
            argv: [/usr/bin/git, -C, "{{ item.path }}", rev-parse, "{{ item.revision }}"]
          loop:
            - { path: "{{ ipmctl_source_dir }}", revision: HEAD, expected: "{{ ipmctl_commit }}" }
            - { path: "{{ ipmctl_source_dir }}", revision: "refs/tags/{{ ipmctl_tag }}^{commit}", expected: "{{ ipmctl_commit }}" }
            - { path: "{{ ipmctl_edk2_source_dir }}", revision: HEAD, expected: "{{ ipmctl_edk2_commit }}" }
            - { path: "{{ ipmctl_edk2_source_dir }}", revision: "refs/tags/{{ ipmctl_edk2_tag }}^{commit}", expected: "{{ ipmctl_edk2_commit }}" }
          register: ipmctl_source_identity
          changed_when: false
          environment:
            HOME: "{{ ipmctl_build_home }}"

        - name: Require exact source identities
          ansible.builtin.assert:
            that:
              - item.stdout | trim == item.item.expected
            fail_msg: "Reviewed source tag or commit identity did not match."
          loop: "{{ ipmctl_source_identity.results }}"

        - name: Preserve EDK2 CRLF source as a binary Git diff
          ansible.builtin.copy:
            dest: "{{ ipmctl_edk2_source_dir }}/.git/info/attributes"
            content: "MdePkg/Include/Base.h binary\n"
            mode: "0600"

        - name: Apply finite reviewed compatibility pack
          ansible.builtin.include_tasks: "../files/ipmctl/apply-patch.yml"
          loop: "{{ ipmctl_patches }}"
          loop_control:
            loop_var: ipmctl_patch
            label: "{{ ipmctl_patch.id }}"

        - name: Inspect EDK2 link destinations
          ansible.builtin.stat:
            path: "{{ ipmctl_source_dir }}/{{ item }}"
            follow: false
          loop: [BaseTools, MdeModulePkg, MdePkg, ShellPkg]
          register: ipmctl_edk2_link_targets

        - name: Require fresh EDK2 link destinations
          ansible.builtin.assert:
            that:
              - not (item.stat.exists | default(false))
            fail_msg: "Refusing to reuse an existing EDK2 component path."
          loop: "{{ ipmctl_edk2_link_targets.results }}"

        - name: Link reviewed EDK2 components explicitly
          ansible.builtin.file:
            src: "{{ ipmctl_edk2_source_dir }}/{{ item }}"
            dest: "{{ ipmctl_source_dir }}/{{ item }}"
            state: link
            force: false
          loop: [BaseTools, MdeModulePkg, MdePkg, ShellPkg]

        - name: Configure reviewed Release build
          ansible.builtin.command:
            argv:
              - /usr/bin/cmake
              - -S
              - "{{ ipmctl_source_dir }}"
              - -B
              - "{{ ipmctl_build_dir }}"
              - -DRELEASE=ON
              - -DCMAKE_BUILD_TYPE=Release
              - "-DBUILDNUM={{ ipmctl_expected_version }}"
              - "-DCMAKE_INSTALL_PREFIX={{ ipmctl_install_prefix }}"
          environment:
            HOME: "{{ ipmctl_build_home }}"

        - name: Compile reviewed Release build
          ansible.builtin.command:
            argv: [/usr/bin/cmake, --build, "{{ ipmctl_build_dir }}", --parallel, "2"]
          environment:
            HOME: "{{ ipmctl_build_home }}"

        - name: Install reviewed Release build
          ansible.builtin.command:
            argv: [/usr/bin/cmake, --install, "{{ ipmctl_build_dir }}"]
          become: true

        - name: Refresh runtime linker cache
          ansible.builtin.command:
            argv: [/sbin/ldconfig]
          become: true
          changed_when: true

        - name: Read installed version and linkage
          ansible.builtin.command:
            argv: "{{ item }}"
          loop:
            - ["{{ ipmctl_binary_path }}", version]
            - [/usr/bin/ldd, "{{ ipmctl_binary_path }}"]
          register: ipmctl_installed_software
          changed_when: false

        - name: Inspect installed binary and manifest
          ansible.builtin.stat:
            path: "{{ item }}"
            follow: true
            checksum_algorithm: sha256
          loop:
            - "{{ ipmctl_binary_path }}"
            - "{{ ipmctl_build_dir }}/install_manifest.txt"
          register: ipmctl_installed_stats

        - name: Require installed software identity
          ansible.builtin.assert:
            that:
              - >-
                (
                  ipmctl_installed_software.results[0].stdout
                  | regex_search('[0-9]{2}\\.[0-9]{2}\\.[0-9]{2}\\.[0-9]{4}')
                  | default('')
                ) == ipmctl_expected_version
              - "'not found' not in ipmctl_installed_software.results[1].stdout"
              - ipmctl_installed_stats.results[0].stat.isreg | default(false)
              - ipmctl_installed_stats.results[1].stat.isreg | default(false)
            fail_msg: "Installed ipmctl version, linkage, or manifest is invalid."

        - name: Read toolchain versions for receipt
          ansible.builtin.command:
            argv: "{{ item }}"
          loop:
            - [/usr/bin/gcc, -dumpfullversion]
            - [/usr/bin/g++, -dumpfullversion]
            - [/usr/bin/cmake, --version]
            - [/usr/bin/dpkg-query, -W, '-f=${Package}=${Version}\n', libndctl-dev, libndctl6]
          register: ipmctl_toolchain_versions
          changed_when: false

        - name: Create managed receipt directory
          ansible.builtin.file:
            path: "{{ ipmctl_receipt_root }}"
            state: directory
            owner: root
            group: root
            mode: "0755"
          become: true

        - name: Preserve CMake install manifest
          ansible.builtin.copy:
            src: "{{ ipmctl_build_dir }}/install_manifest.txt"
            dest: "{{ ipmctl_install_manifest_path }}"
            remote_src: true
            owner: root
            group: root
            mode: "0644"
          become: true

        - name: Write atomic installation receipt
          ansible.builtin.copy:
            dest: "{{ ipmctl_receipt_path }}"
            owner: root
            group: root
            mode: "0644"
            content: >-
              {{
                {
                  'schema_version': 1,
                  'installed_at': now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ'),
                  'platform': {'debian': '13', 'architecture': 'amd64'},
                  'ipmctl': {'tag': ipmctl_tag, 'commit': ipmctl_commit, 'version': ipmctl_expected_version},
                  'edk2': {'tag': ipmctl_edk2_tag, 'commit': ipmctl_edk2_commit},
                  'patches': ipmctl_patch_receipt,
                  'toolchain': {
                    'gcc': ipmctl_toolchain_versions.results[0].stdout | trim,
                    'g++': ipmctl_toolchain_versions.results[1].stdout | trim,
                    'cmake': ipmctl_toolchain_versions.results[2].stdout_lines | first,
                    'libndctl': ipmctl_toolchain_versions.results[3].stdout_lines
                  },
                  'install': {
                    'prefix': ipmctl_install_prefix,
                    'binary': ipmctl_binary_path,
                    'binary_sha256': ipmctl_installed_stats.results[0].stat.checksum
                  }
                }
                | to_nice_json
              }}
          become: true

        - name: Report retained build workspace
          ansible.builtin.debug:
            msg: "Pinned source/build workspace retained at {{ ipmctl_run_root }}"
