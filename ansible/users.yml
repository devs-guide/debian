---
- name: "[debian]: baseline users"
  hosts: all
  become: true
  gather_facts: true

  vars:
    ansible_python_interpreter: "{{ ansible_python_interpreter_managed }}"
    default_password_hash_algo: sha512

  tasks:
    - name: Ensure users exist with expected shell and groups
      ansible.builtin.user:
        name: "{{ item.name }}"
        password: >-
          {{
            item.password_hash
            if (item.password_hash | default('') | length > 0)
            else (
              (
                item.password | default(item.name, true)
              ) | password_hash(default_password_hash_algo)
            )
          }}
        password_lock: >-
          {{
            item.password_lock
            if (item.password_lock is defined)
            else false
          }}
        groups: "{{ (item.groups | default([])) | join(',') if (item.groups | default([]) | length > 0) else omit }}"
        append: true
        shell: "{{ item.shell | default('/bin/bash') }}"
        create_home: true
        state: present
        update_password: on_create
      loop: "{{ user_defs }}"

    - name: Clear password expiry and inactivity requirements
      ansible.builtin.command: >
        chage -I -1 -m 0 -M 99999 -E -1 -d {{ ansible_facts["date_time"]["date"] }} {{ item.name }}
      loop: "{{ user_defs }}"
