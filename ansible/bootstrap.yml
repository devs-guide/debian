---
- name: "[debian]: bootstrap package prerequisites and upgrade"
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars:
    ansible_python_interpreter: "{{ ansible_python_interpreter_system }}"
    apt_cache_valid_time: 0
    bootstrap_packages:
      - ca-certificates
      - curl
      - wget
      - gnupg
      - sudo
      - python3
      - python3-apt
      - python3-venv

  tasks:
    - name: Refresh apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: "{{ apt_cache_valid_time }}"

    - name: Perform safe package upgrade
      ansible.builtin.apt:
        upgrade: safe

    - name: Ensure bootstrap prerequisites are present
      ansible.builtin.apt:
        name: "{{ bootstrap_packages }}"
        state: present

    - name: Report bootstrap completion
      ansible.builtin.debug:
        msg:
          - "Debian bootstrap complete."
          - "Shared packages and Python prerequisites are installed."
