---
- name: "[debian]: baseline SSH and firewall networking"
  hosts: all
  become: true
  gather_facts: true

  vars:
    ansible_python_interpreter: "{{ ansible_python_interpreter_managed }}"
    network_overrides: {}
    network_config: "{{ (network_defaults | default({})) | combine(network_overrides | default({}), recursive=True) }}"

  pre_tasks:
    - name: Load shared SSH defaults
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/ssh.yml"

    - name: Assert Debian family
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == "Debian"
        fail_msg: "This playbook is intended for Debian-family hosts."

    - name: Capture shared user names
      ansible.builtin.set_fact:
        shared_user_names: "{{ (user_defs | default([])) | map(attribute='name') | list }}"

    - name: Resolve SSH policy inputs
      ansible.builtin.set_fact:
        resolved_ssh_allowed_users: >-
          {{
            ssh_allowed_users
            if (ssh_allowed_users | default([]) | length > 0)
            else (
              debian_ssh_defaults.access.allow_users
              if (debian_ssh_defaults.access.allow_users | default([]) | length > 0)
              else (
                network_config.allowed_users
                if (network_config.allowed_users | default([]) | length > 0)
                else shared_user_names
              )
            )
          }}

    - name: Build safe networking values
      ansible.builtin.set_fact:
        network_allowed_users: "{{ (resolved_ssh_allowed_users | default([])) | union(['root']) }}"
        network_allow_subnets: "{{ network_config.allow_subnets | default([]) }}"

    - name: Ensure networking values are usable
      ansible.builtin.set_fact:
        network_allow_subnets: "{{ ['10.0.0.0/24'] if (network_allow_subnets | length == 0) else network_allow_subnets }}"

    - name: Collect service facts
      ansible.builtin.service_facts:

    - name: Resolve SSH service unit name
      ansible.builtin.set_fact:
        ssh_service_name: >-
          {{
            'ssh'
            if ('ssh.service' in ansible_facts.services or 'ssh' in ansible_facts.services)
            else (
              'sshd'
              if ('sshd.service' in ansible_facts.services or 'sshd' in ansible_facts.services)
              else 'ssh'
            )
          }}

  tasks:
    - name: Ensure sshd_config loads managed drop-ins
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^Include\s+/etc/ssh/sshd_config\.d/\*\.conf$'
        line: 'Include /etc/ssh/sshd_config.d/*.conf'
        insertbefore: BOF
        create: false
        mode: "0644"
      notify: Validate and reload ssh

    - name: Ensure SSH include directory exists
      ansible.builtin.file:
        path: "{{ debian_ssh_defaults.server.include_dir }}"
        state: directory
        mode: "0755"

    - name: Write Debian SSH baseline drop-in
      ansible.builtin.copy:
        dest: "{{ debian_ssh_defaults.server.include_path }}"
        mode: "0644"
        content: |
          # Ansible managed: Debian bootstrap SSH baseline.
          Port {{ network_config.ssh_port | default(debian_ssh_defaults.server.port) }}
          PermitRootLogin {{ debian_ssh_defaults.server.permit_root_login }}
          PasswordAuthentication {{ debian_ssh_defaults.server.password_authentication }}
          PubkeyAuthentication {{ debian_ssh_defaults.server.pubkey_authentication }}
          KbdInteractiveAuthentication {{ debian_ssh_defaults.server.kbd_interactive_authentication }}
          PermitEmptyPasswords {{ debian_ssh_defaults.server.permit_empty_passwords }}
          UsePAM {{ debian_ssh_defaults.server.use_pam }}
          X11Forwarding {{ debian_ssh_defaults.server.x11_forwarding }}
          AllowUsers {{ network_allowed_users | join(' ') }}
      notify: Validate and reload ssh

    - name: Apply SSH policy before firewall changes
      ansible.builtin.meta: flush_handlers

    - name: Ensure SSH service is enabled and running
      ansible.builtin.service:
        name: "{{ ssh_service_name | default('ssh') }}"
        state: started
        enabled: true

    - name: Ensure UFW is installed
      ansible.builtin.apt:
        name: ufw
        state: present
      when: network_config.manage_ufw | default(true)

    - name: Disable IPv6 in UFW
      ansible.builtin.lineinfile:
        path: /etc/default/ufw
        regexp: '^IPV6='
        line: 'IPV6=no'
      when: network_config.manage_ufw | default(true)
      notify: Reload ufw

    - name: Allow SSH from permitted subnets
      community.general.ufw:
        rule: allow
        port: "{{ network_config.ssh_port | default(debian_ssh_defaults.server.port) }}"
        proto: tcp
        src: "{{ item }}"
      loop: "{{ network_allow_subnets }}"
      when:
        - network_config.manage_ufw | default(true)
        - debian_ssh_defaults.firewall.manage_ufw_ssh_rules | default(true)

    - name: Allow RDP from permitted subnets when enabled
      community.general.ufw:
        rule: allow
        port: "{{ network_config.rdp_port }}"
        proto: tcp
        src: "{{ item }}"
      loop: "{{ network_allow_subnets }}"
      when:
        - network_config.manage_ufw | default(true)
        - network_config.allow_rdp | default(false) | bool

    - name: Allow all TCP from permitted LAN subnets for bootstrap access
      ansible.builtin.command: >
        ufw allow from {{ item }} to any proto tcp
      register: ufw_lan_tcp_allow
      changed_when: >-
        'Rule added' in ufw_lan_tcp_allow.stdout
        or 'Rules updated' in ufw_lan_tcp_allow.stdout
      failed_when: ufw_lan_tcp_allow.rc != 0
      loop: "{{ network_allow_subnets }}"
      when:
        - network_config.manage_ufw | default(true)
        - network_config.allow_lan_tcp | default(true) | bool
        - debian_ssh_defaults.firewall.manage_ufw_lan_tcp_rules | default(true) | bool

    - name: Set UFW default incoming policy
      community.general.ufw:
        direction: incoming
        policy: deny
      when: network_config.manage_ufw | default(true)

    - name: Set UFW default outgoing policy
      community.general.ufw:
        direction: outgoing
        policy: allow
      when: network_config.manage_ufw | default(true)

    - name: Ensure UFW is enabled with low logging
      community.general.ufw:
        state: enabled
        logging: low
      when: network_config.manage_ufw | default(true)
      notify: Reload ufw

    - name: Read effective sshd configuration
      ansible.builtin.command: /usr/sbin/sshd -T
      register: sshd_effective_config
      changed_when: false

    - name: Assert SSH password and root bootstrap access is active
      ansible.builtin.assert:
        that:
          - "'permitrootlogin yes' in sshd_effective_config.stdout"
          - "'passwordauthentication yes' in sshd_effective_config.stdout"
          - "'allowusers' in sshd_effective_config.stdout"
          - "'root' in sshd_effective_config.stdout"
        fail_msg: "Effective sshd config does not permit expected bootstrap root/password access."

    - name: Read UFW status
      ansible.builtin.command: ufw status verbose
      register: ufw_status_verbose
      changed_when: false
      when: network_config.manage_ufw | default(true)

    - name: Assert permitted LAN subnet appears in UFW rules
      ansible.builtin.assert:
        that:
          - "item in ufw_status_verbose.stdout"
        fail_msg: "UFW does not contain expected LAN subnet rule for {{ item }}."
      loop: "{{ network_allow_subnets }}"
      when: network_config.manage_ufw | default(true)

    - name: Assert UFW has broad LAN TCP bootstrap allow
      ansible.builtin.assert:
        that:
          - "'ALLOW IN' in ufw_status_verbose.stdout"
          - "'10.0.0.0/24' in ufw_status_verbose.stdout"
        fail_msg: "UFW is missing the broad LAN TCP bootstrap allow rule."
      when:
        - network_config.manage_ufw | default(true)
        - network_config.allow_lan_tcp | default(true) | bool

  handlers:
    - name: Validate SSH daemon configuration
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false
      listen: Validate and reload ssh

    - name: Reload SSH service
      ansible.builtin.service:
        name: "{{ ssh_service_name | default('ssh') }}"
        state: reloaded
      listen: Validate and reload ssh

    - name: Reload ufw
      community.general.ufw:
        state: reloaded
