---
- name: "[debian]: node via nvm"
  hosts: all
  connection: local
  gather_facts: false
  become: true

  vars:
    ansible_python_interpreter: "{{ ansible_python_interpreter_managed }}"
    node_enable: false
    node_mode: "apply"   # preflight | apply | upgrade
    node_nvm_version: "{{ nvm_version | default('v0.40.4') }}"
    node_nvm_dir: "{{ nvm_dir | default('/root/.nvm') }}"
    node_version: "lts/*"
    node_npm_policy: "bundled"   # bundled | pinned | latest
    node_npm_version: ""
    node_global_packages: []
    node_create_system_symlinks: true
    node_enable_corepack: false
    node_runtime_facts_path: "/etc/ansible/debian/facts/node.yml"
    node_nvm_profile_hook_path: "/etc/profile.d/nvm.sh"
    node_nvm_installer_path: "/tmp/nvm-install.sh"
    node_required_packages:
      - curl
      - wget
      - ca-certificates
      - bash

  pre_tasks:
    - name: Check Debian host marker
      ansible.builtin.stat:
        path: /etc/debian_version
      register: debian_version_marker

    - name: Assert Debian family host
      ansible.builtin.assert:
        that:
          - debian_version_marker.stat.exists
        fail_msg: "Node feature is supported only on Debian-family hosts."

    - name: Normalize node mode and package inputs
      ansible.builtin.set_fact:
        node_mode_effective: "{{ node_mode | default('apply') | lower }}"
        node_npm_policy_effective: "{{ node_npm_policy | default('bundled') | lower }}"
        node_global_packages_effective: >-
          {{
            node_global_packages
            if (node_global_packages is sequence and node_global_packages is not string)
            else (
              node_global_packages | default('') | string | split(' ')
              | reject('equalto', '') | list
            )
          }}

    - name: Validate node mode
      ansible.builtin.assert:
        that:
          - node_mode_effective in ['preflight', 'apply', 'upgrade']
        fail_msg: "Unsupported node_mode={{ node_mode_effective }}. Use preflight, apply, or upgrade."

    - name: Validate npm policy
      ansible.builtin.assert:
        that:
          - node_npm_policy_effective in ['bundled', 'pinned', 'latest']
        fail_msg: "Unsupported node_npm_policy={{ node_npm_policy_effective }}. Use bundled, pinned, or latest."

    - name: Validate pinned npm version when policy is pinned
      ansible.builtin.assert:
        that:
          - (node_npm_policy_effective != 'pinned') or (node_npm_version | default('') | length > 0)
        fail_msg: "node_npm_version must be set when node_npm_policy is pinned."

    - name: Check required package installability
      ansible.builtin.command:
        argv:
          - apt-cache
          - policy
          - "{{ item }}"
      register: node_required_pkg_check
      changed_when: false
      loop: "{{ node_required_packages }}"
      loop_control:
        label: "{{ item }}"

    - name: Capture current node runtime state
      ansible.builtin.shell: |
        set -e
        node_v="$(node --version 2>/dev/null || true)"
        npm_v="$(npm --version 2>/dev/null || true)"
        npx_v="$(npx --version 2>/dev/null || true)"
        printf 'node_version=%s\n' "${node_v:-missing}"
        printf 'npm_version=%s\n' "${npm_v:-missing}"
        printf 'npx_version=%s\n' "${npx_v:-missing}"
      args:
        executable: /bin/bash
      register: node_preflight_versions
      changed_when: false

    - name: Show preflight runtime versions
      ansible.builtin.debug:
        msg: "{{ node_preflight_versions.stdout_lines | default([]) }}"

    - name: End play in preflight mode
      ansible.builtin.meta: end_play
      when: node_mode_effective == 'preflight'

  tasks:
    - name: Check if nvm is already installed
      ansible.builtin.stat:
        path: "{{ node_nvm_dir }}/nvm.sh"
      register: nvm_sh
      when: node_enable | bool

    - name: Download nvm installer when missing
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/nvm-sh/nvm/{{ node_nvm_version }}/install.sh"
        dest: "{{ node_nvm_installer_path }}"
        mode: "0755"
      when:
        - node_enable | bool
        - not nvm_sh.stat.exists

    - name: Install nvm when missing
      ansible.builtin.shell: |
        set -e
        export NVM_DIR="{{ node_nvm_dir }}"
        /bin/bash "{{ node_nvm_installer_path }}"
      args:
        executable: /bin/bash
        creates: "{{ node_nvm_dir }}/nvm.sh"
      when:
        - node_enable | bool
        - not nvm_sh.stat.exists

    - name: Refresh nvm status after installation
      ansible.builtin.stat:
        path: "{{ node_nvm_dir }}/nvm.sh"
      register: nvm_sh_after
      when: node_enable | bool

    - name: Install and select requested Node.js version via nvm
      ansible.builtin.shell: |
        set -euo pipefail
        export NVM_DIR="{{ node_nvm_dir }}"
        . "{{ node_nvm_dir }}/nvm.sh"
        nvm install "{{ node_version }}"
        nvm alias default "{{ node_version }}" >/dev/null
        nvm use default >/dev/null
        printf 'resolved_node=%s\n' "$(nvm current)"
        printf 'node_path=%s\n' "$(nvm which default)"
        printf 'node_version=%s\n' "$(node --version 2>/dev/null || true)"
        printf 'npm_version=%s\n' "$(npm --version 2>/dev/null || true)"
        printf 'npx_version=%s\n' "$(npx --version 2>/dev/null || true)"
      args:
        executable: /bin/bash
      register: node_install_result
      changed_when: true
      when:
        - node_enable | bool
        - (nvm_sh_after.stat.exists | default(nvm_sh.stat.exists))
        - node_mode_effective in ['apply', 'upgrade']

    - name: Apply npm policy
      ansible.builtin.shell: |
        set -euo pipefail
        export NVM_DIR="{{ node_nvm_dir }}"
        . "{{ node_nvm_dir }}/nvm.sh"
        nvm use default >/dev/null
        changed=0
        case "{{ node_npm_policy_effective }}" in
          bundled)
            ;;
          pinned)
            current="$(npm --version 2>/dev/null || true)"
            target="{{ node_npm_version }}"
            if [ "${current}" != "${target}" ]; then
              npm install -g "npm@${target}"
              changed=1
            fi
            ;;
          latest)
            npm install -g npm@latest
            changed=1
            ;;
        esac
        printf 'changed=%s\n' "${changed}"
      args:
        executable: /bin/bash
      register: node_npm_policy_result
      changed_when: "'changed=1' in (node_npm_policy_result.stdout | default(''))"
      when:
        - node_enable | bool
        - node_mode_effective in ['apply', 'upgrade']

    - name: Install optional global npm packages
      ansible.builtin.shell: |
        set -euo pipefail
        export NVM_DIR="{{ node_nvm_dir }}"
        . "{{ node_nvm_dir }}/nvm.sh"
        nvm use default >/dev/null
        if npm list -g --depth=0 "{{ item }}" >/dev/null 2>&1; then
          echo "changed=0"
        else
          npm install -g "{{ item }}"
          echo "changed=1"
        fi
      args:
        executable: /bin/bash
      register: node_global_pkg_result
      changed_when: "'changed=1' in (node_global_pkg_result.stdout | default(''))"
      loop: "{{ node_global_packages_effective }}"
      loop_control:
        label: "{{ item }}"
      when:
        - node_enable | bool
        - node_global_packages_effective | length > 0
        - node_mode_effective in ['apply', 'upgrade']

    - name: Enable corepack when requested
      ansible.builtin.shell: |
        set -euo pipefail
        export NVM_DIR="{{ node_nvm_dir }}"
        . "{{ node_nvm_dir }}/nvm.sh"
        nvm use default >/dev/null
        corepack enable
      args:
        executable: /bin/bash
      changed_when: true
      when:
        - node_enable | bool
        - node_enable_corepack | bool
        - node_mode_effective in ['apply', 'upgrade']

    - name: Ensure nvm profile hook is available for all users
      ansible.builtin.copy:
        dest: "{{ node_nvm_profile_hook_path }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          export NVM_DIR="{{ node_nvm_dir }}"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          [ -s "$NVM_DIR/bash_completion" ] && . "$NVM_DIR/bash_completion"
      when:
        - node_enable | bool
        - (nvm_sh_after.stat.exists | default(nvm_sh.stat.exists))
        - node_mode_effective in ['apply', 'upgrade']

    - name: Configure system symlinks for node/npm/npx
      ansible.builtin.shell: |
        set -euo pipefail
        export NVM_DIR="{{ node_nvm_dir }}"
        . "{{ node_nvm_dir }}/nvm.sh"
        nvm use default >/dev/null
        node_path="$(nvm which default)"
        bin_dir="$(dirname "${node_path}")"
        npm_path="${bin_dir}/npm"
        npx_path="${bin_dir}/npx"
        changed=0
        if [ -x "${node_path}" ]; then
          if [ "$(readlink /usr/local/bin/node 2>/dev/null || true)" != "${node_path}" ]; then
            changed=1
          fi
          ln -sf "${node_path}" /usr/local/bin/node
        fi
        if [ -x "${npm_path}" ]; then
          if [ "$(readlink /usr/local/bin/npm 2>/dev/null || true)" != "${npm_path}" ]; then
            changed=1
          fi
          ln -sf "${npm_path}" /usr/local/bin/npm
        fi
        if [ -x "${npx_path}" ]; then
          if [ "$(readlink /usr/local/bin/npx 2>/dev/null || true)" != "${npx_path}" ]; then
            changed=1
          fi
          ln -sf "${npx_path}" /usr/local/bin/npx
        fi
        printf 'node_path=%s\n' "${node_path}"
        printf 'npm_path=%s\n' "${npm_path}"
        printf 'npx_path=%s\n' "${npx_path}"
        printf 'changed=%s\n' "${changed}"
      args:
        executable: /bin/bash
      register: node_symlink_result
      changed_when: "'changed=1' in (node_symlink_result.stdout | default(''))"
      when:
        - node_enable | bool
        - node_create_system_symlinks | bool
        - (nvm_sh_after.stat.exists | default(nvm_sh.stat.exists))
        - node_mode_effective in ['apply', 'upgrade']

    - name: Capture final Node runtime details
      ansible.builtin.shell: |
        set -euo pipefail
        export NVM_DIR="{{ node_nvm_dir }}"
        . "{{ node_nvm_dir }}/nvm.sh"
        nvm use default >/dev/null
        node_path="$(nvm which default)"
        bin_dir="$(dirname "${node_path}")"
        npm_path="${bin_dir}/npm"
        npx_path="${bin_dir}/npx"
        printf 'resolved_node=%s\n' "$(nvm current)"
        printf 'node_version=%s\n' "$(node --version 2>/dev/null || true)"
        printf 'npm_version=%s\n' "$(npm --version 2>/dev/null || true)"
        printf 'npx_version=%s\n' "$(npx --version 2>/dev/null || true)"
        printf 'node_path=%s\n' "${node_path}"
        printf 'npm_path=%s\n' "${npm_path}"
        printf 'npx_path=%s\n' "${npx_path}"
      args:
        executable: /bin/bash
      register: node_runtime_info
      changed_when: false
      when:
        - node_enable | bool
        - (nvm_sh_after.stat.exists | default(nvm_sh.stat.exists))
        - node_mode_effective in ['apply', 'upgrade']

    - name: Ensure node facts directory exists
      ansible.builtin.file:
        path: "{{ node_runtime_facts_path | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      when:
        - node_enable | bool
        - node_mode_effective in ['apply', 'upgrade']

    - name: Write node runtime facts
      ansible.builtin.copy:
        dest: "{{ node_runtime_facts_path }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          ---
          node:
            enabled: true
            install_method: "nvm"
            nvm_dir: "{{ node_nvm_dir }}"
            requested_version: "{{ node_version }}"
            resolved_node_version: "{{ (node_runtime_info.stdout | regex_search('resolved_node=(.+)', '\\1') | first | default('unknown')) }}"
            node_version: "{{ (node_runtime_info.stdout | regex_search('node_version=(.+)', '\\1') | first | default('unknown')) }}"
            npm_version: "{{ (node_runtime_info.stdout | regex_search('npm_version=(.+)', '\\1') | first | default('unknown')) }}"
            npx_version: "{{ (node_runtime_info.stdout | regex_search('npx_version=(.+)', '\\1') | first | default('unknown')) }}"
            node_path: "{{ (node_runtime_info.stdout | regex_search('node_path=(.+)', '\\1') | first | default('')) }}"
            npm_path: "{{ (node_runtime_info.stdout | regex_search('npm_path=(.+)', '\\1') | first | default('')) }}"
            npx_path: "{{ (node_runtime_info.stdout | regex_search('npx_path=(.+)', '\\1') | first | default('')) }}"
            system_symlinks:
              node: "/usr/local/bin/node"
              npm: "/usr/local/bin/npm"
              npx: "/usr/local/bin/npx"
      when:
        - node_enable | bool
        - node_mode_effective in ['apply', 'upgrade']
