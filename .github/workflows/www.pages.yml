name: Publish static assets to www

on:
  push:
    branches:
      - main
    paths:
      - "setup/**"
      - "ansible/**"
      - "docs/**"
      - "www/**"
      - "readme.md"
      - "actions/**"
      - ".github/workflows/www.pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: www-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-www:
    needs: validate-ipmctl-source
    runs-on: ubuntu-slim
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure validation Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: actions/requirements.validation.txt

      - name: Install pinned runtime validation dependencies
        run: python -m pip install --disable-pip-version-check --requirement actions/requirements.validation.txt

      - name: Validate runtime contract
        env:
          LLM_SOURCE_NETWORK_VERIFY: "1"
          IPMCTL_SOURCE_NETWORK_VERIFY: "1"
        run: bash ./actions/validate.runtime.sh

      - name: Install Pages build dependencies
        run: sudo apt-get update && sudo apt-get install -y pandoc rsync

      - name: Build static tree for www branch
        env:
          PUBLISH_DIR: static
        run: bash ./actions/www.pages.sh

      - name: Deploy static to www branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./static
          publish_branch: www
          force_orphan: true

  validate-ipmctl-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: debian:13

    steps:
      - name: Install pinned ipmctl build dependencies
        run: |
          apt-get update
          apt-get install -y \
            git ca-certificates build-essential cmake pkgconf python3 \
            ndctl daxctl libndctl6 libndctl-dev asciidoctor

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build reviewed ipmctl source
        run: bash ./actions/test.ipmctl-source-build.sh
