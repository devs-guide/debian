name: Publish static assets to www

on:
  push:
    branches:
      - main
    paths:
      - "setup/**"
      - "ansible/**"
      - "docs/**"
      - "www/**"
      - "readme.md"
      - "actions/**"
      - ".github/workflows/www.pages.yml"
  pull_request:
    paths:
      - "setup/**"
      - "ansible/**"
      - "docs/**"
      - "www/**"
      - "readme.md"
      - "actions/**"
      - ".github/workflows/www.pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: www-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-runtime:
    runs-on: ubuntu-slim
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure validation Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: actions/requirements.validation.txt

      - name: Install pinned runtime validation dependencies
        run: python -m pip install --disable-pip-version-check --requirement actions/requirements.validation.txt

      - name: Validate runtime contract
        env:
          LLM_SOURCE_NETWORK_VERIFY: "1"
        run: bash ./actions/validate.runtime.sh

  build-www:
    needs: validate-runtime
    runs-on: ubuntu-slim
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pages build dependencies
        run: sudo apt-get update && sudo apt-get install -y pandoc rsync

      - name: Build static tree for www branch
        env:
          PUBLISH_DIR: static
        run: bash ./actions/www.pages.sh

      - name: Upload static Pages tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: www-static
          path: static
          if-no-files-found: error

  deploy-www:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-www
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download static Pages tree
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: www-static
          path: static

      - name: Deploy static to www branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./static
          publish_branch: www
          force_orphan: true
