<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Legacy homepage source · devs-guide/debian</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f3ea;
        --ink: #1d2a26;
        --muted: #59655f;
        --accent: #9e5a28;
        --panel: #fffdf8;
        --line: #d8cfbf;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        background:
          radial-gradient(circle at top left, rgba(158, 90, 40, 0.14), transparent 28rem),
          linear-gradient(180deg, #faf7ef 0%, var(--bg) 100%);
        color: var(--ink);
      }

      main {
        max-width: 52rem;
        margin: 0 auto;
        padding: 3rem 1.25rem 4rem;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 1rem;
        padding: 1.5rem;
        box-shadow: 0 1rem 2rem rgba(29, 42, 38, 0.06);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 5vw, 3.25rem);
        line-height: 1;
      }

      p, li {
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.6;
      }

      code, pre {
        font-family: "SFMono-Regular", Menlo, Consolas, monospace;
      }

      pre {
        overflow-x: auto;
        padding: 0.9rem 1rem;
        border-radius: 0.75rem;
        background: #f2ede1;
        border: 1px solid var(--line);
      }

      a {
        color: var(--accent);
      }

      ul {
        padding-left: 1.25rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <h1>Legacy homepage source</h1>
        <p>
          This file is retained as a historical source record. The published
          root page is now rendered from <code>docs/readme.md</code>.
        </p>
        <p>
          Current documentation: <a href="https://devs-guide.github.io/debian/">devs-guide.github.io/debian</a>
        </p>
        <p>
          Published automation source files are under <code>setup/</code> and
          always use a <code>.sh</code> suffix.
        </p>
      </div>
    </main>
  </body>
</html>
